plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.10.3'
}

group = 'com.ligeroframework'
// version comes from gradle.properties; release CI overrides with -Pversion=<tag>
description = 'Scaffolding CLI for the Ligero web framework'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.ligero.cli.LigeroCli'
    applicationName = 'ligero'
}

dependencies {
    // Cero dependencias en runtime — coherente con la filosofía del framework
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

test {
    useJUnitPlatform()
}

// GraalVM native image: a single self-contained `ligero` binary per OS —
// no JVM required, near-instant startup. Built in CI (see .github/workflows/release.yml).
graalvmNative {
    toolchainDetection = false
    binaries {
        main {
            imageName = 'ligero'
            mainClass = 'com.ligero.cli.LigeroCli'
            buildArgs.add('--no-fallback')
            buildArgs.add('-O2')
        }
    }
}
