plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '0.11.5'
}

group = 'com.ligeroframework'
// version comes from gradle.properties; release CI overrides with -Pversion=<tag>
description = 'Scaffolding CLI for the Ligero web framework'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

application {
    mainClass = 'com.ligero.cli.LigeroCli'
    applicationName = 'ligero'
}

dependencies {
    // Cero dependencias en runtime — coherente con la filosofía del framework
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.26.3'
}

// The version printed by `ligero version` comes from the build (-Pversion),
// so it can never drift from the released artifact.
def generatedVersionDir = layout.buildDirectory.dir('generated/version')
def generateBuildVersion = tasks.register('generateBuildVersion') {
    def out = generatedVersionDir
    def v = project.version.toString()
    inputs.property('version', v)
    outputs.dir(out)
    doLast {
        def file = out.get().file('com/ligero/cli/BuildVersion.java').asFile
        file.parentFile.mkdirs()
        file.text = "package com.ligero.cli;\n\nfinal class BuildVersion {\n    static final String VALUE = \"${v}\";\n\n    private BuildVersion() {\n    }\n}\n"
    }
}
sourceSets.main.java.srcDir(generateBuildVersion.map { generatedVersionDir })

test {
    useJUnitPlatform()
    systemProperty 'expected.version', project.version.toString()
}

// GraalVM native image: a single self-contained `ligero` binary per OS —
// no JVM required, near-instant startup. Built in CI (see .github/workflows/release.yml).
graalvmNative {
    toolchainDetection = false
    binaries {
        main {
            imageName = 'ligero'
            mainClass = 'com.ligero.cli.LigeroCli'
            buildArgs.add('--no-fallback')
            buildArgs.add('-O2')
        }
    }
}
