name: Release CLI

# When you publish a GitHub Release (tag e.g. v0.1.0), this builds a native
# `ligero` binary for each OS with GraalVM (no JVM required), plus the JVM
# distribution zip, and attaches everything — with the installers — to the Release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without leading v)'
        required: true

# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read

jobs:
  native:
    permissions:
      contents: write   # attach the binaries to the release
    name: native (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     label: linux-x64,     ext: '' }
          - { os: ubuntu-24.04-arm,  label: linux-arm64,   ext: '' }
          - { os: macos-13,          label: macos-x64,     ext: '' }
          - { os: macos-latest,      label: macos-arm64,   ext: '' }
          - { os: windows-latest,    label: windows-x64,   ext: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Resolve version
        shell: bash
        # Values reach the script through the environment, never by textual
        # substitution into it, and must look like a version.
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "Refusing suspicious version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build native image
        shell: bash
        run: ./gradlew nativeCompile -Pversion="$VERSION" --no-daemon --stacktrace

      - name: Rename binary and write its checksum
        shell: bash
        run: |
          asset="ligero-${{ matrix.label }}${{ matrix.ext }}"
          cp "build/native/nativeCompile/ligero${{ matrix.ext }}" "$asset"
          # <asset>.sha256 is what install.sh / install.ps1 verify the download against
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" | cut -d' ' -f1 > "$asset.sha256"
          else
            shasum -a 256 "$asset" | cut -d' ' -f1 > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ligero-${{ matrix.label }}${{ matrix.ext }}
            ligero-${{ matrix.label }}${{ matrix.ext }}.sha256

  jvm-dist:
    name: jvm zip + installers
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach the zip and installers to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        # Values reach the script through the environment, never by textual
        # substitution into it, and must look like a version.
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="${RAW_VERSION#v}"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+-]*$ ]]; then
            echo "Refusing suspicious version: $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build distribution zip
        run: ./gradlew distZip -Pversion="$VERSION" --no-daemon

      - name: Attach zip + installers to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/distributions/*.zip
            install.sh
            install.ps1

  bump-snapshot:
    # After a successful release, open a PR moving `main` to the next patch
    # -SNAPSHOT so everyday development targets the upcoming version.
    # Only for real releases (not workflow_dispatch) and not pre-releases.
    needs: [native, jvm-dist]
    if: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Compute next -SNAPSHOT from the tag
        id: next
        run: |
          released="${GITHUB_REF_NAME#v}"
          if [[ ! "$released" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$released' is not X.Y.Z — skipping the snapshot bump."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS='.' read -r major minor patch <<< "$released"
          echo "next=${major}.${minor}.$((patch + 1))-SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Apply the bump
        if: steps.next.outputs.skip != 'true'
        env:
          NEXT_VERSION: ${{ steps.next.outputs.next }}
        run: sed -i -E "s/^version=.*/version=${NEXT_VERSION}/" gradle.properties

      - name: Open the version-bump PR
        if: steps.next.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # `main` is protected (changes go through a PR + checks), so open a PR
          # instead of pushing. Use a RELEASE_BOT_TOKEN (PAT/App token) so the
          # PR's checks run — GITHUB_TOKEN-created PRs don't trigger CI. Enable
          # repo auto-merge to land it hands-free.
          token: ${{ secrets.RELEASE_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          base: main
          branch: chore/next-snapshot
          delete-branch: true
          add-paths: gradle.properties
          commit-message: "chore: begin ${{ steps.next.outputs.next }} development"
          title: "chore: begin ${{ steps.next.outputs.next }} development"
          body: |
            Automated post-release bump of `gradle.properties` to the next
            `-SNAPSHOT` (`${{ steps.next.outputs.next }}`) after publishing
            `${{ github.ref_name }}`. Safe to merge once checks pass.
          author: Duvan Jamid <duvanjamid.work@gmail.com>
          committer: Duvan Jamid <duvanjamid.work@gmail.com>
